<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work | Ipsa Patel Studio</title>
<meta name="description" content="Etching, wedding decor, signage, and digital graphics by Ipsa Patel.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="nav">
  <div class="wrap">
    <a class="mark" href="index.html">IPA</a>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="work.html" aria-current="page">Work</a></li>
      <li><a href="live.html">Live</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
  </div>
</header>

<main>
  <section class="pagehead">
    <div class="wrap">
      <p class="eyebrow">Portfolio</p>
      <h1>Work</h1>
      <p class="lede">Choose a category, then select any piece to see it larger. Use the arrow keys to move through them.</p>
    </div>
  </section>

  <section class="wrap" style="padding-block: 0 8px">
    <div class="chips" role="group" aria-label="Filter work by category">
      <button class="chip" type="button" data-filter="all" aria-pressed="true">All</button>
      <button class="chip" type="button" data-filter="etching" aria-pressed="false">Etching and lettering</button>
      <button class="chip" type="button" data-filter="weddings" aria-pressed="false">Weddings and events</button>
      <button class="chip" type="button" data-filter="signage" aria-pressed="false">Signage</button>
      <button class="chip" type="button" data-filter="digital" aria-pressed="false">Digital graphics</button>
    </div>
    <p class="count" id="count" aria-live="polite"></p>

    <!-- To add a photo: put the file in an images folder and add <img src="images/name.jpg" alt="..."> inside the button, before the span. -->
    <div class="grid">
      <figure class="item" data-cat="etching"><button class="slot c" type="button" aria-label="View engraved compacts"><span>Photo</span></button><h3>Engraved compacts</h3><p>Names lettered by hand and etched into gold mirrors.</p></figure>
      <figure class="item" data-cat="etching"><button class="slot b" type="button" aria-label="View whiskey bottle labels"><span>Photo</span></button><h3>Whiskey bottle labels</h3><p>Custom etched names and dates on gift bottles.</p></figure>
      <figure class="item" data-cat="etching"><button class="slot a" type="button" aria-label="View personalized glassware"><span>Photo</span></button><h3>Personalized glassware</h3><p>Monograms and names on tumblers and tasting glasses.</p></figure>

      <figure class="item" data-cat="weddings"><button class="slot a" type="button" aria-label="View reception tablescape"><span>Photo</span></button><h3>Reception tablescape</h3><p>Candles, black chargers, and pink uplighting.</p></figure>
      <figure class="item" data-cat="weddings"><button class="slot c" type="button" aria-label="View entrance and mandap styling"><span>Photo</span></button><h3>Entrance and mandap styling</h3><p>Draping, florals, and ironwork for a ceremony.</p></figure>
      <figure class="item" data-cat="weddings"><button class="slot b" type="button" aria-label="View carved screen backdrop"><span>Photo</span></button><h3>Carved screen backdrop</h3><p>Soft florals and fabric around a carved wood screen.</p></figure>

      <figure class="item" data-cat="signage"><button class="slot b" type="button" aria-label="View welcome party sign"><span>Photo</span></button><h3>Welcome party sign</h3><p>"Love &amp; Pizza" themed, painted and lettered by hand.</p></figure>
      <figure class="item" data-cat="signage"><button class="slot a" type="button" aria-label="View engagement frame"><span>Photo</span></button><h3>Engagement frame</h3><p>Dried florals around a hand-lettered couple's name.</p></figure>
      <figure class="item" data-cat="signage"><button class="slot c" type="button" aria-label="View chalkboard menu"><span>Photo</span></button><h3>Chalkboard menu</h3><p>Street-food themed sign for a mehndi night.</p></figure>

      <figure class="item" data-cat="digital"><button class="slot c" type="button" aria-label="View matchup graphic"><span>Image</span></button><h3>Matchup graphic</h3><p>Bills vs. Dolphins. Concept social post.</p></figure>
      <figure class="item" data-cat="digital"><button class="slot a" type="button" aria-label="View player spotlight"><span>Image</span></button><h3>Player spotlight</h3><p>Cutout, oversized number, bold type. Concept work.</p></figure>
      <figure class="item" data-cat="digital"><button class="slot b" type="button" aria-label="View game day poster"><span>Image</span></button><h3>Game day poster</h3><p>Illustrated lion, scoreboard type. Concept work.</p></figure>
    </div>
    <p class="count" style="margin-top:32px">I also paint, crochet, and design posters. Ask and I will send more.</p>
  </section>
</main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <div class="lb-inner">
    <div class="stage"></div>
    <div class="cap"><h3></h3><p></p></div>
    <div class="lb-bar">
      <button type="button" data-prev>Previous</button>
      <button type="button" data-close>Close</button>
      <button type="button" data-next>Next</button>
    </div>
  </div>
</div>

<footer>&copy; 2026 IPSA PATEL</footer>
<script src="main.js"></script>
</body>
</html>
